# Axylith keybindings — example
#
# Copy this to one of (later entries win):
#   $XDG_CONFIG_HOME/axylith/keys.conf   (or ~/.config/axylith/keys.conf)
#   ./axylith.keys                       (per-project, next to the binary)
#
# Syntax:   <mods+>key = command
#   mods    ctrl, shift, alt   (alt is parsed but ignored in matching)
#   key     a-z, 0-9, or a named key:
#           left right up down home end tab return enter
#           backspace escape esc space f1..f12
#   command see the list at the bottom; "none" unbinds the chord
#
# Lines starting with # are comments. Unknown lines are reported on stderr
# and skipped — a bad config never stops the editor from starting.
#
# Letter case is carried by shift, so write `ctrl+z`, not `ctrl+Z`.

# ── Examples (all commented; uncomment to apply) ──────

# Emacs-style save instead of Ctrl+S:
# ctrl+w   = save

# Swap redo onto Ctrl+Shift+Z only, free up Ctrl+Y:
# ctrl+y         = none
# ctrl+shift+z   = redo

# Vim-ish word motion on Alt (alt is ignored, so this just rebinds the keys):
# ctrl+left   = move_word_left
# ctrl+right  = move_word_right

# Disable the metrics HUD toggle:
# f1 = none

# ── Full command list ────────────────────────────────
#   save  reload  open_palette
#   undo  redo
#   copy  cut  paste
#   find  replace
#   backspace  delete_word_left  newline  insert_tab
#   move_left  move_right  move_up  move_down  move_home  move_end
#   move_word_left  move_word_right
#   select_left  select_right  select_word_left  select_word_right
#   toggle_metrics  quit
#   none   (unbind)
