<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="900" height="320" role="img" aria-label="V2 AXLHeader byte layout (32 bytes)">
    <defs>
        <linearGradient id="bg-v2" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#0d0e10"/>
            <stop offset="100%" stop-color="#13151a"/>
        </linearGradient>
        <linearGradient id="acc-v2" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stop-color="#c89858"/>
            <stop offset="100%" stop-color="#b88848"/>
        </linearGradient>
    </defs>

    <rect width="900" height="320" fill="url(#bg-v2)" rx="8"/>

    <!-- Title strip -->
    <text x="40" y="36" font-family="JetBrains Mono, monospace" font-size="11" fill="#5a5249" letter-spacing="2">
        V2 AXLHeader · 32 BYTES · SPECIFIED, NOT YET WRITTEN
    </text>
    <line x1="40" y1="46" x2="860" y2="46" stroke="#2a2d34" stroke-width="1"/>

    <!-- 32 bytes wide: 25px each across 800px, starting at x=50 -->
    <!-- Byte labels top -->
    <g font-family="JetBrains Mono, monospace" font-size="8" fill="#3a3d44" text-anchor="middle">
        <text x="62"  y="72">00</text>
        <text x="87"  y="72">01</text>
        <text x="112" y="72">02</text>
        <text x="137" y="72">03</text>
        <text x="162" y="72">04</text>
        <text x="187" y="72">05</text>
        <text x="212" y="72">06</text>
        <text x="237" y="72">07</text>
        <text x="262" y="72">08</text>
        <text x="287" y="72">09</text>
        <text x="312" y="72">0A</text>
        <text x="337" y="72">0B</text>
        <text x="362" y="72">0C</text>
        <text x="387" y="72">0D</text>
        <text x="412" y="72">0E</text>
        <text x="437" y="72">0F</text>
        <text x="462" y="72">10</text>
        <text x="487" y="72">11</text>
        <text x="512" y="72">12</text>
        <text x="537" y="72">13</text>
        <text x="562" y="72">14</text>
        <text x="587" y="72">15</text>
        <text x="612" y="72">16</text>
        <text x="637" y="72">17</text>
        <text x="662" y="72">18</text>
        <text x="687" y="72">19</text>
        <text x="712" y="72">1A</text>
        <text x="737" y="72">1B</text>
        <text x="762" y="72">1C</text>
        <text x="787" y="72">1D</text>
        <text x="812" y="72">1E</text>
        <text x="837" y="72">1F</text>
    </g>

    <!-- Row 1: magic(4), ver(1), flg(1), proj_count(2), page_count(2), block_count(4), base_ts(2), str_pool_off(4), str_pool_sz(4), blob_pool_off(4), blob_pool_sz(4) -->

    <!-- magic [0-3] - 4 bytes, 100 wide -->
    <g>
        <rect x="50" y="80" width="100" height="48" rx="3" fill="#1a2026" stroke="url(#acc-v2)" stroke-width="1.2"/>
        <text x="100" y="103" font-family="JetBrains Mono, monospace" font-size="12" fill="#e8dcc8" text-anchor="middle" font-weight="500">magic</text>
        <text x="100" y="120" font-family="JetBrains Mono, monospace" font-size="9" fill="#c89858" text-anchor="middle">"AXEL"</text>
    </g>

    <!-- ver [4] - 1 byte, 25 wide -->
    <g>
        <rect x="150" y="80" width="25" height="48" rx="3" fill="#1c1a16" stroke="#5a5249" stroke-width="1"/>
        <text x="162" y="103" font-family="JetBrains Mono, monospace" font-size="9" fill="#e8dcc8" text-anchor="middle">v</text>
        <text x="162" y="118" font-family="JetBrains Mono, monospace" font-size="7" fill="#8b8275" text-anchor="middle">1</text>
    </g>

    <!-- flg [5] - 1 byte, 25 wide -->
    <g>
        <rect x="175" y="80" width="25" height="48" rx="3" fill="#1c1a16" stroke="#5a5249" stroke-width="1"/>
        <text x="187" y="103" font-family="JetBrains Mono, monospace" font-size="9" fill="#e8dcc8" text-anchor="middle">f</text>
        <text x="187" y="118" font-family="JetBrains Mono, monospace" font-size="7" fill="#8b8275" text-anchor="middle">1B</text>
    </g>

    <!-- proj_count [6-7] - 2 bytes, 50 wide -->
    <g>
        <rect x="200" y="80" width="50" height="48" rx="3" fill="#16181c" stroke="#5a5249" stroke-width="1"/>
        <text x="225" y="100" font-family="JetBrains Mono, monospace" font-size="10" fill="#e8dcc8" text-anchor="middle">proj</text>
        <text x="225" y="115" font-family="JetBrains Mono, monospace" font-size="8" fill="#8b8275" text-anchor="middle">count</text>
        <text x="225" y="125" font-family="JetBrains Mono, monospace" font-size="7" fill="#5a5249" text-anchor="middle">u16</text>
    </g>

    <!-- page_count [8-9] - 2 bytes, 50 wide -->
    <g>
        <rect x="250" y="80" width="50" height="48" rx="3" fill="#16181c" stroke="#5a5249" stroke-width="1"/>
        <text x="275" y="100" font-family="JetBrains Mono, monospace" font-size="10" fill="#e8dcc8" text-anchor="middle">page</text>
        <text x="275" y="115" font-family="JetBrains Mono, monospace" font-size="8" fill="#8b8275" text-anchor="middle">count</text>
        <text x="275" y="125" font-family="JetBrains Mono, monospace" font-size="7" fill="#5a5249" text-anchor="middle">u16</text>
    </g>

    <!-- block_count [10-13] - 4 bytes, 100 wide -->
    <g>
        <rect x="300" y="80" width="100" height="48" rx="3" fill="#16181c" stroke="#5a5249" stroke-width="1"/>
        <text x="350" y="100" font-family="JetBrains Mono, monospace" font-size="11" fill="#e8dcc8" text-anchor="middle">block_count</text>
        <text x="350" y="118" font-family="JetBrains Mono, monospace" font-size="8" fill="#5a5249" text-anchor="middle">u32</text>
    </g>

    <!-- base_ts [14-15] - 2 bytes, 50 wide -->
    <g>
        <rect x="400" y="80" width="50" height="48" rx="3" fill="#16181c" stroke="#5a5249" stroke-width="1"/>
        <text x="425" y="100" font-family="JetBrains Mono, monospace" font-size="10" fill="#e8dcc8" text-anchor="middle">base</text>
        <text x="425" y="115" font-family="JetBrains Mono, monospace" font-size="8" fill="#8b8275" text-anchor="middle">ts</text>
        <text x="425" y="125" font-family="JetBrains Mono, monospace" font-size="7" fill="#5a5249" text-anchor="middle">u16</text>
    </g>

    <!-- str_pool_off [16-19] - 4 bytes, 100 wide -->
    <g>
        <rect x="450" y="80" width="100" height="48" rx="3" fill="#1a1c20" stroke="#3a3d44" stroke-width="1"/>
        <text x="500" y="100" font-family="JetBrains Mono, monospace" font-size="11" fill="#e8dcc8" text-anchor="middle">str_pool</text>
        <text x="500" y="115" font-family="JetBrains Mono, monospace" font-size="9" fill="#8b8275" text-anchor="middle">offset</text>
        <text x="500" y="125" font-family="JetBrains Mono, monospace" font-size="7" fill="#5a5249" text-anchor="middle">u32</text>
    </g>

    <!-- str_pool_sz [20-23] - 4 bytes, 100 wide -->
    <g>
        <rect x="550" y="80" width="100" height="48" rx="3" fill="#1a1c20" stroke="#3a3d44" stroke-width="1"/>
        <text x="600" y="100" font-family="JetBrains Mono, monospace" font-size="11" fill="#e8dcc8" text-anchor="middle">str_pool</text>
        <text x="600" y="115" font-family="JetBrains Mono, monospace" font-size="9" fill="#8b8275" text-anchor="middle">size</text>
        <text x="600" y="125" font-family="JetBrains Mono, monospace" font-size="7" fill="#5a5249" text-anchor="middle">u32</text>
    </g>

    <!-- blob_pool_off [24-27] - 4 bytes, 100 wide -->
    <g>
        <rect x="650" y="80" width="100" height="48" rx="3" fill="#1a1c20" stroke="#3a3d44" stroke-width="1"/>
        <text x="700" y="100" font-family="JetBrains Mono, monospace" font-size="11" fill="#e8dcc8" text-anchor="middle">blob_pool</text>
        <text x="700" y="115" font-family="JetBrains Mono, monospace" font-size="9" fill="#8b8275" text-anchor="middle">offset</text>
        <text x="700" y="125" font-family="JetBrains Mono, monospace" font-size="7" fill="#5a5249" text-anchor="middle">u32</text>
    </g>

    <!-- blob_pool_sz [28-31] - 4 bytes, 100 wide -->
    <g>
        <rect x="750" y="80" width="100" height="48" rx="3" fill="#1a1c20" stroke="#3a3d44" stroke-width="1"/>
        <text x="800" y="100" font-family="JetBrains Mono, monospace" font-size="11" fill="#e8dcc8" text-anchor="middle">blob_pool</text>
        <text x="800" y="115" font-family="JetBrains Mono, monospace" font-size="9" fill="#8b8275" text-anchor="middle">size</text>
        <text x="800" y="125" font-family="JetBrains Mono, monospace" font-size="7" fill="#5a5249" text-anchor="middle">u32</text>
    </g>

    <!-- File layout map below header -->
    <text x="40" y="172" font-family="JetBrains Mono, monospace" font-size="11" fill="#5a5249" letter-spacing="2">FILE LAYOUT</text>
    <line x1="40" y1="180" x2="860" y2="180" stroke="#2a2d34" stroke-width="0.5"/>

    <!-- Vertical layout strip -->
    <g font-family="JetBrains Mono, monospace">
        <!-- Block 1: AXLHeader -->
        <rect x="50" y="200" width="160" height="32" rx="3" fill="#1a2026" stroke="url(#acc-v2)" stroke-width="1"/>
        <text x="130" y="220" font-size="11" fill="#e8dcc8" text-anchor="middle">AXLHeader</text>
        <text x="130" y="232" font-size="8" fill="#c89858" text-anchor="middle" opacity="0.7">32 B</text>

        <!-- arrow -->
        <line x1="210" y1="216" x2="226" y2="216" stroke="#5a5249" stroke-width="1"/>
        <polyline points="220,212 226,216 220,220" fill="none" stroke="#5a5249" stroke-width="1"/>

        <!-- Block 2: Project[] -->
        <rect x="230" y="200" width="100" height="32" rx="3" fill="#16181c" stroke="#5a5249" stroke-width="1"/>
        <text x="280" y="220" font-size="11" fill="#e8dcc8" text-anchor="middle">Project[]</text>
        <text x="280" y="232" font-size="8" fill="#8b8275" text-anchor="middle">10 B each</text>

        <line x1="330" y1="216" x2="346" y2="216" stroke="#5a5249" stroke-width="1"/>
        <polyline points="340,212 346,216 340,220" fill="none" stroke="#5a5249" stroke-width="1"/>

        <!-- Block 3: Page[] -->
        <rect x="350" y="200" width="100" height="32" rx="3" fill="#16181c" stroke="#5a5249" stroke-width="1"/>
        <text x="400" y="220" font-size="11" fill="#e8dcc8" text-anchor="middle">Page[]</text>
        <text x="400" y="232" font-size="8" fill="#8b8275" text-anchor="middle">22 B each</text>

        <line x1="450" y1="216" x2="466" y2="216" stroke="#5a5249" stroke-width="1"/>
        <polyline points="460,212 466,216 460,220" fill="none" stroke="#5a5249" stroke-width="1"/>

        <!-- Block 4: Block[] -->
        <rect x="470" y="200" width="100" height="32" rx="3" fill="#16181c" stroke="#5a5249" stroke-width="1"/>
        <text x="520" y="220" font-size="11" fill="#e8dcc8" text-anchor="middle">Block[]</text>
        <text x="520" y="232" font-size="8" fill="#8b8275" text-anchor="middle">12 B each</text>

        <line x1="570" y1="216" x2="586" y2="216" stroke="#5a5249" stroke-width="1"/>
        <polyline points="580,212 586,216 580,220" fill="none" stroke="#5a5249" stroke-width="1"/>

        <!-- Block 5: string pool -->
        <rect x="590" y="200" width="110" height="32" rx="3" fill="#1a1c20" stroke="#3a3d44" stroke-width="1"/>
        <text x="645" y="220" font-size="11" fill="#e8dcc8" text-anchor="middle">String Pool</text>
        <text x="645" y="232" font-size="8" fill="#8b8275" text-anchor="middle">UTF-8 bytes</text>

        <line x1="700" y1="216" x2="716" y2="216" stroke="#5a5249" stroke-width="1"/>
        <polyline points="710,212 716,216 710,220" fill="none" stroke="#5a5249" stroke-width="1"/>

        <!-- Block 6: blob pool -->
        <rect x="720" y="200" width="130" height="32" rx="3" fill="#1a1c20" stroke="#3a3d44" stroke-width="1"/>
        <text x="785" y="220" font-size="11" fill="#e8dcc8" text-anchor="middle">Blob Pool</text>
        <text x="785" y="232" font-size="8" fill="#8b8275" text-anchor="middle">raw bytes</text>
    </g>

    <!-- Footnote -->
    <text x="40" y="280" font-family="JetBrains Mono, monospace" font-size="10" fill="#5a5249" letter-spacing="0.5">
        each section's offset is derivable from the previous section's size + the counts in the header.
    </text>
    <text x="40" y="295" font-family="JetBrains Mono, monospace" font-size="10" fill="#5a5249" letter-spacing="0.5">
        pools live at the end so headers and structured records read in a single sequential pass.
    </text>
</svg>