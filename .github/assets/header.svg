<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" width="900" height="220" role="img" aria-label="Axylith — a native research environment">
    <defs>
        <!-- Background gradient: subtle, terminal-feel -->
        <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#0d0e10"/>
            <stop offset="100%" stop-color="#16181c"/>
        </linearGradient>

        <!-- Accent gradient: warm amber, matches the editor cursor color -->
        <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stop-color="#c89858"/>
            <stop offset="50%" stop-color="#d4a468"/>
            <stop offset="100%" stop-color="#b88848"/>
        </linearGradient>

        <!-- Soft glow for the cursor -->
        <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="2" result="b"/>
            <feMerge>
                <feMergeNode in="b"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>

        <!-- Fine grid texture, very subtle -->
        <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
            <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1f2126" stroke-width="0.5"/>
        </pattern>
    </defs>

    <!-- Background -->
    <rect width="900" height="220" fill="url(#bg)"/>
    <rect width="900" height="220" fill="url(#grid)" opacity="0.6"/>

    <!-- Top border accent (a thin amber line, like a status indicator) -->
    <rect x="0" y="0" width="900" height="1" fill="url(#accent)" opacity="0.4"/>

    <!-- Left column markers — like line numbers in an editor -->
    <g fill="#3a3d44" font-family="JetBrains Mono, Menlo, Consolas, monospace" font-size="11" text-anchor="end">
        <text x="55" y="62">01</text>
        <text x="55" y="92">02</text>
        <text x="55" y="122">03</text>
        <text x="55" y="152">04</text>
        <text x="55" y="182">05</text>
    </g>

    <!-- Vertical separator line, like an editor gutter -->
    <line x1="75" y1="40" x2="75" y2="195" stroke="#2a2d34" stroke-width="1"/>

    <!-- Main wordmark — large, JetBrains Mono feel -->
    <g font-family="JetBrains Mono, Menlo, Consolas, monospace">
        <!-- "axylith" in lowercase, soft warm text color, like editor text -->
        <text x="100" y="115" fill="#e8dcc8" font-size="72" font-weight="500" letter-spacing="-1.5">
            axylith
        </text>

        <!-- Blinking cursor at the end of the wordmark -->
        <rect x="430" y="58" width="14" height="68" fill="url(#accent)" filter="url(#glow)" opacity="0.9">
            <animate attributeName="opacity" values="0.9;0.9;0.0;0.0;0.9" dur="1.1s" repeatCount="indefinite"/>
        </rect>

        <!-- Subtitle, more muted -->
        <text x="100" y="160" fill="#8b8275" font-size="20" font-weight="400" letter-spacing="0">
            a native research environment
        </text>

        <!-- Status line: faint, technical, like editor status bar -->
        <text x="100" y="190" fill="#5a5249" font-size="11" letter-spacing="1.5">
            <tspan fill="url(#accent)" opacity="0.7">●</tspan>
            <tspan dx="6">PRE-V1</tspan>
            <tspan dx="14">LINUX/X11</tspan>
            <tspan dx="14">VULKAN 1.3</tspan>
            <tspan dx="14">C++20</tspan>
            <tspan dx="14">AGPL-V3</tspan>
        </text>
    </g>

    <!-- Right side: small "code" decoration, looks like syntax highlighting -->
    <g font-family="JetBrains Mono, Menlo, Consolas, monospace" font-size="11" opacity="0.35">
        <text x="700" y="62" fill="#6a7280">// research workbench</text>
        <text x="700" y="82" fill="#888278">code · prose · data · 3D</text>
        <text x="700" y="102" fill="#6a7280">// integration thesis</text>
        <text x="700" y="122" fill="#888278">one binary · one surface</text>
        <text x="700" y="142" fill="#6a7280">// status</text>
        <text x="700" y="162" fill="#888278">in active development</text>
    </g>

    <!-- Bottom border accent -->
    <rect x="0" y="219" width="900" height="1" fill="url(#accent)" opacity="0.4"/>
</svg>