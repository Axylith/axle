name: Build

# CI matrix running inside a pre-baked container.
# All build deps are baked into the image at ghcr.io/<owner>/axylith-ci:latest.
# Rebuilt via .github/workflows/docker-ci-image.yml when the Dockerfile changes.

on:
  push:
    paths-ignore:
      - '**.md'
      - '**.mdx'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
      - 'changelog.md'
  pull_request:
    paths-ignore:
      - '**.md'
      - '**.mdx'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
      - 'changelog.md'

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ----- Standard build + test matrix -----
  build:
    name: ${{ matrix.compiler }} / ${{ matrix.build_type }}
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/${{ github.repository_owner }}/axylith-ci:latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc-12, gcc-13, clang-17]
        build_type: [Debug, Release, RelWithDebInfo]

    steps:
      - uses: actions/checkout@v4

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ matrix.compiler }}-${{ matrix.build_type }}
          max-size: 200M

      - name: Resolve compiler binaries
        run: |
          CC_BIN="${{ matrix.compiler }}"
          CXX_BIN=$(echo "${{ matrix.compiler }}" | sed 's/gcc/g++/;s/clang/clang++/')
          echo "CC=$CC_BIN"   >> $GITHUB_ENV
          echo "CXX=$CXX_BIN" >> $GITHUB_ENV

      - name: Configure
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DCMAKE_C_COMPILER=$CC \
            -DCMAKE_CXX_COMPILER=$CXX \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: cmake --build build -j

      - name: Test
        working-directory: build
        run: ctest --output-on-failure

  # ----- Sanitizer builds (clang-17, Debug) -----
  sanitizers:
    name: ${{ matrix.san }}
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/${{ github.repository_owner }}/axylith-ci:latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - san: asan
            flags: "-fsanitize=address -fno-omit-frame-pointer -g"
          - san: ubsan
            flags: "-fsanitize=undefined -fno-omit-frame-pointer -g"
          - san: tsan
            flags: "-fsanitize=thread -fno-omit-frame-pointer -g"

    steps:
      - uses: actions/checkout@v4

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: san-${{ matrix.san }}
          max-size: 200M

      - name: Configure
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER=clang-17 \
            -DCMAKE_CXX_COMPILER=clang++-17 \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_FLAGS="${{ matrix.flags }}" \
            -DCMAKE_EXE_LINKER_FLAGS="${{ matrix.flags }}"

      - name: Build
        run: cmake --build build -j

      - name: Test
        working-directory: build
        run: ctest --output-on-failure --output-junit results.xml

      - name: Publish test results
        uses: mikepenz/action-junit-report@v4
        if: always()
        with:
          report_paths: 'build/results.xml'