name: CI base image

# Rebuild the CI Docker image only when the Dockerfile changes.
# The image is published to GitHub Container Registry under the repo owner.
on:
  push:
    branches: [main, development]
    paths:
      - '.github/docker/Dockerfile.ci'
      - '.github/workflows/docker-ci-image.yml'
  workflow_dispatch:   # also runnable manually from the Actions tab

jobs:
  build-image:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write   # required to push to GHCR
    steps:
      - uses: actions/checkout@v6

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Lowercase owner
        id: owner
        run: echo "name=$(echo ${{ github.repository_owner }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: .github/docker/Dockerfile.ci
          push: true
          tags: |
            ghcr.io/${{ steps.owner.outputs.name }}/axylith-ci:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max